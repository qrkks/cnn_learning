[project]
name = "cnn-learning"
version = "0.1.0"
description = "A project for learning convolutional neural networks (CNNs) using PyTorch."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "requests>=2.33.1",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "nbstripout>=0.9.1",
]
